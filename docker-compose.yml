services:
  api:
    image: node:20-alpine
    working_dir: /app
    command: ["node","apps/api/src/server.mjs"]
    expose:
      - "8787"
    ports:
      - "8787:8787"
    volumes:
      - ./:/app:ro
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "4173:80"
    volumes:
      - ./apps/web/public:/usr/share/nginx/html:ro
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
