services:
  api:
    image: node:24-alpine
    working_dir: /app
    command: ["node","apps/api/src/server.mjs"]
    user: "node"
    expose:
      - "8787"
    ports:
      - "8787:8787"
    volumes:
      - ./:/app:ro
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4173:80"
    volumes:
      - ./apps/web/public:/usr/share/nginx/html:ro
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
