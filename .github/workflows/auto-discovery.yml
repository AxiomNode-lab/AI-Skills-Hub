name: Auto Discovery Bot

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Run Discovery Bot
        run: node scripts/discover-skills.mjs
        
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: auto-discovered new skills"
          title: "🤖 Auto-Discovery: New AI Skills Found"
          body: "The Auto-Discovery Bot has found new high-ranking AI skills on GitHub and added them to the registry."
          branch: auto-discovery-update
          base: main
