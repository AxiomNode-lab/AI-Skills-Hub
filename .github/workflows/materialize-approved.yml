name: Materialize Approved Skills

concurrency:
  group: ai-skills-hub-materialize
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/materialize-approved.mjs --all
      - run: pnpm validate-all
      - name: Commit materialized skills
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No materialization changes."
            exit 0
          fi
          git config user.name "ai-skills-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: materialize approved skills"
          git push
