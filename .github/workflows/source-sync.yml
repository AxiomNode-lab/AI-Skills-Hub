name: Source Sync

concurrency:
  group: ai-skills-hub-source-sync
  cancel-in-progress: true

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: |
          node scripts/ingest-github.mjs anthropics/skills main
          node scripts/ingest-github.mjs obra/superpowers main
          node scripts/ingest-github.mjs vercel-labs/agent-skills main
          node scripts/ingest-github.mjs trailofbits/skills main
          node scripts/ingest-github.mjs K-Dense-AI/scientific-agent-skills main
          node scripts/ingest-github.mjs microsoft/skills main
          node scripts/ingest-github.mjs openai/plugins main
          node scripts/refresh-source-index.mjs
          node scripts/sync-curated-catalog.mjs
          node scripts/generate-lockfile.mjs
      - run: node scripts/validate-registry.mjs
      - name: Commit snapshots
        run: |
          if git diff --quiet; then
            echo "No source metadata changes."
            exit 0
          fi
          git config user.name "ai-skills-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/ingestion catalog/skills.json catalog/skills.lock.json catalog/source-index.json
          git commit -m "chore: refresh source ingestion snapshots"
          git push
