name: Source Sync

concurrency:
  group: ai-skills-hub-source-sync
  cancel-in-progress: true

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh upstream registry metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm sync-registry
      - run: pnpm validate-all
      - name: Commit snapshots
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source metadata changes."
            exit 0
          fi
          git config user.name "ai-skills-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/
          git commit -m "chore: refresh source ingestion snapshots"
          git push
