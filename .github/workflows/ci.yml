name: CI

concurrency:
  group: ai-skills-hub-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: node scripts/validate-sources.mjs
      - run: pnpm generate-lock
      - run: node scripts/validate-materialized.mjs
      - run: git diff --exit-code -- catalog/skills.lock.json
      - run: pnpm test
      - run: pnpm dedupe
      - run: git diff --exit-code -- catalog/reports/dedupe.json
      - run: pnpm audit
