<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090a0d">
  <title>AI Skills Hub — Agent Skills Registry</title>
  <meta name="description" content="Discover AI Agent Skills with provenance, licensing, compatibility, and security metadata.">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow-row">
        <p class="eyebrow">AI SKILLS HUB</p>
        <span class="version" id="version">registry</span>
      </div>
      <h1>Find the right Skill.<br><span>Know what you are installing.</span></h1>
      <p class="lede">A provenance-first registry for AI Agent Skills with license, compatibility, and security visibility.</p>
      <div class="search-row">
        <input id="search" placeholder="Search skills, publishers, categories…" autocomplete="off" spellcheck="false">
      </div>
      <div class="filter-row">
        <select id="agent"><option value="">All agents</option></select>
        <select id="distribution"><option value="">All distribution states</option><option value="bundled">Bundled</option><option value="source-direct">Source-direct</option><option value="review-required">Review required</option><option value="blocked">Blocked</option></select>
        <select id="category"><option value="">All categories</option></select>
        <button id="clear" type="button">Clear</button>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <section>
      <div class="section-head">
        <div>
          <h2>Curated catalog</h2>
          <p id="count" class="muted"></p>
        </div>
      </div>
      <div id="skills" class="grid"></div>
      <div id="empty" class="empty hidden">No Skills matched your filters.</div>
    </section>
  </main>

  <aside id="drawer" class="drawer hidden" aria-hidden="true">
    <div class="drawer-backdrop" id="drawer-close"></div>
    <div class="drawer-panel">
      <div class="drawer-head">
        <div>
          <p class="eyebrow">SKILL DETAILS</p>
          <h2 id="drawer-title"></h2>
        </div>
        <button id="drawer-x" type="button" aria-label="Close">×</button>
      </div>
      <div id="drawer-body"></div>
    </div>
  </aside>

  <script type="module" src="./app.js"></script>
</body>
</html>
