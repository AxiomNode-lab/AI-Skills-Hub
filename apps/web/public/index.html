<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Skills Hub</title>
  <meta name="description" content="Discover, inspect, and install AI Agent Skills with provenance, licensing, and security metadata.">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">AI SKILLS HUB</p>
      <h1>Find the right Skill.<br><span>Know what you are installing.</span></h1>
      <p class="lede">A provenance-first catalog for Agent Skills with license and security visibility.</p>
      <input id="search" placeholder="Search skills, publishers, categories…" autocomplete="off">
    </header>
    <section class="stats" id="stats"></section>
    <section>
      <div class="section-head"><h2>Curated catalog</h2><span id="count"></span></div>
      <div id="skills" class="grid"></div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
